<!doctype html>
<!-- sempre alterar para linguagem pt-br -->
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revisão</title>
    <!-- criar um link para lincar o css -->
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!-- tag para iniciar uma tabela  -->
    <table>
      <!-- tag nome da tabela inteira  -->
      <caption>
        Tabela completa
      </caption>
      <!-- cabeçalho da tabela -->
      <thead>
        <!-- linha da tabela horizontal -->
        <tr>
          <!-- titulo de cada célula-->
          <th>Produtos</th>
          <th>Preço</th>
        </tr>
      </thead>
      <!-- corpo da tabela -->
      <tbody>
        <!-- linha da tabela -->
        <tr>
          <!-- conteudo da célula lembrando que a primeira linha que eu queria vai ser relativo a primeiro coluna  -->
           <!-- rowspan = "2" ocupa mais de uma linha então teremos que excluir uma linha -->
          <td rowspan="2">Arroz</td>
          <td>R$ 29,90</td>
        </tr>

        <tr>
          <td>Feijão</td>
          <td>R$10,99</td>
        </tr>

        <tr>
          <td>Café</td>
          <td>R$ 26,99</td>
        </tr>
      </tbody>
      <!-- rodapé -->
      <tfoot>
        <!-- criar uma linha  -->
        <tr>
          <!-- criar um titulo -->
          <th>Total de Produtos</th>
          <!-- criar célula -->
          <td>R$ 59,99</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
