<!doctype html>
<!-- sempre configurar para pt-br -->
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- titulo do site -->
    <title>Tabela completa</title>

    <style>
      body {
        background-color: #000;
      }

      table {
        width: 400px;
        font-size: 20px;
      }

      td {
        width: 20px;
        height: 20px;
        text-align: center;
        vertical-align: center;
      }
      table,
      td {
        border: 1px solid #000;
        border-collapse: collapse;
      }
      th {
        padding: 5px;
      }

      thead {
        background-color: #f2f2f2;
      }

      tbody {
        background-color: beige;
      }

      tfoot {
        background-color: #f2f2f2;
      }

      caption {
        color: #fff;
      }
      .titulo {
        background-color: #f2f2f2;
        color: #000;
      }
    </style>
  </head>
  <body>
    <table>
      <!-- titulo da tabela -->
      <caption>
        Titulo da tabela
      </caption>
      <!-- Cabeçalho da tabela -->
      <thead>
        <tr>
          <th>Mês</th>
          <th>Serviço</th>
          <th>Valor</th>
        </tr>
      </thead>
      <!-- corpor da tabela -->
      <tbody>
        <tr class="titulo">
          <td>Janeiro</td>
          <td>Consultoria</td>
          <td>R$ 2.000</td>
        </tr>

        <tr>
          <td rowspan="2">Fevereiro</td>
          <td>Desenvolvimento</td>
          <td>R$ 8.000</td>
        </tr>

        <tr>
          <td>suporte</td>
          <td>R$ 3.000</td>
        </tr>

        <tr>
          <td>Março</td>
          <td>front-end</td>
          <td>R$ 9.000</td>
        </tr>
      </tbody>
      <!-- rodapé da tabela -->
      <tfoot>
        <tr>
          <th colspan="2">Total Geral</th>
          <td>R$ 15.000</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
