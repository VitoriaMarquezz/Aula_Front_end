<!-- o html é o esqueleto da minha página -->
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- titulo do meu site  -->
    <title>Revisao</title>

    <link rel="stylesheet" href="src/style/revisao.css" />
  </head>
  <!-- tudo que mostra para o usuario fica dentro do body -->
  <body>
    <!-- textos -->
    <h1>listas de compras</h1>
    <!-- ol - lista ordenada ul lista não ordenada -->
    <ul>
      <li>arroz</li>
      <li>feijao</li>
      <li>batata</li>
      <li>sabão em pó</li>
      <li>detergente</li>
    </ul>

    <h1>listas 2</h1>
    <!-- start limita até onde deve começar a lista  -->
    <!-- type é os tipos de parametros que temos  -->
    <ol start="5">
      <li>arroz</li>
      <li>feijão</li>
      <li>macarrão</li>
      <li>arroz</li>
      <li>salada</li>
    </ol>
  </body>
</html>
