<!doctype html>
<!-- linguagem sempre alterar para "pt-br"  -->
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- nome do site -->
    <title>paragrafos</title>
  </head>
  <body>
    <!-- tipos de titulos tem vários tamanhos e vai ficando do menor para o maior (h1 até h6) -->
    <h1>tags de paragrafos</h1>

    <!-- tag de paragráfos -->
    <!-- para destacar uma palavra: seleciona a palavra faz ctrp + p e coloca a opção ">emmet: wrap with abbreviation clica e coloca strong e vaia parecer igual o lorem-->
    <p>
      <strong>lorem</strong> ipsum dolor, sit amet consectetur adipisicing elit.
      Soluta voluptate optio eos, libero est quibusdam facere repudiandae sequi
      perferendis quaerat laboriosam, ipsum tempore at labore pariatur assumenda
      provident consequuntur minus!
    </p>

    <!-- tag de link como o link nas aspas e >< colocar o titulo -->
    <a href="https://git-scm.com/install/windows">git</a>
    <!-- tag de imagem pode ser uma caminho nas pastas ou o link de um foto no google opção "copiar endereço de imagem no alt você pode descever a imagem para pessoas com deficoência " -->
    <!-- tag com link do google  -->
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqaoPgGoImZn_Hw00adFYO2B8RFKFoPMDJ_YWQeqGnyQ&s"
      alt="moto preta"
    />

    <!-- tag com caminho de pasta copia a imagem coloca na pasta primeiro vai ter a pasta src colaca imagem na pasta imagem no código coloca src ctr + espaço opção scr/imagem/arquivo da imagem -->
    <img
      src="src/images/30141_BRH_100010_B_foto360_desktop_3_5e1adf0223.png"
      alt=""
    />
  </body>
</html>
