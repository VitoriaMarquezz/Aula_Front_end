<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha Médica</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body class="pagina">
    <form action="" method="get" class="meu-formulario">
      <fieldset class="caixa-formulario">
        <legend class="titulo-fieldset">Dados pessoais</legend>

        <!-- Nome do Paciente -->
        <label for="nome" class="rotulo">Nome do Paciente: </label>
        <input
          type="text"
          name="nome"
          id="nome"
          class="campo-texto"
          placeholder="Digite seu nome"
          required
        />
        <br />

        <!-- Data da Consulta -->
        <label for="data" class="rotulo">Data da Consulta: </label>
        <input type="date" name="data" id="data" class="campo-data" required />
        <br />

        <!-- Especialidade Médica -->
        <label for="especialidade" class="rotulo">Especialidade Médica: </label>
        <select name="especialidade" id="especialidade" class="campo-select">
          <option value="">--Escolha--</option>
          <option value="clinica">Clínica Geral</option>
          <option value="cardio">Cardiologia</option>
          <option value="derma">Dermatologia</option>
          <option value="pediatria">Pediatria</option>
        </select>
        <br />

        <!-- Plano de Saúde -->
        <label for="plano" class="rotulo">Plano de Saúde: </label>
        <select name="plano" id="plano" class="campo-select">
          <option value="">--Escolha--</option>
          <option value="particular">Particular</option>
          <option value="unimed">Unimed</option>
          <option value="amil">Amil</option>
          <option value="bradesco">Bradesco Saúde</option>
        </select>
        <br />

        <!-- Primeira consulta na clínica? -->
        <label class="rotulo">Primeira consulta na clínica? </label> <br />
        <input
          type="radio"
          name="primeira"
          id="primeiraS"
          value="sim"
          class="opcao-radio"
        />
        <label for="primeiraS" class="rotulo-opcao">Sim</label>

        <input
          type="radio"
          name="primeira"
          id="primeiraN"
          value="nao"
          class="opcao-radio"
        />
        <label for="primeiraN" class="rotulo-opcao">Não</label>
        <br /><br />

        <!-- Necessidade de Acessibilidade no local -->
        <label class="rotulo">Necessidade de Acessibilidade no local:</label>
        <br />
        <input
          type="checkbox"
          name="acessibilidade1"
          id="rampa"
          class="opcao-check"
        />
        <label for="rampa" class="rotulo-opcao">Rampa de acesso</label> <br />

        <input
          type="checkbox"
          name="acessibilidade2"
          id="libras"
          class="opcao-check"
        />
        <label for="libras" class="rotulo-opcao">Intérprete de Libras</label>
        <br />

        <input
          type="checkbox"
          name="acessibilidade3"
          id="cao"
          class="opcao-check"
        />
        <label for="cao" class="rotulo-opcao">Espaço para Cão Guia</label>
        <br /><br />

        <!-- Guia Médica ou Encaminhamento -->
        <label for="arquivo" class="rotulo"
          >Guia Médica ou Encaminhamento:
        </label>
        <input type="file" name="arquivo" id="arquivo" class="campo-arquivo" />
        <br />

        <p>
          <!-- Confirmar Agendamento -->
          <input
            type="submit"
            value="Confirmar Agendamento"
            class="botao-enviar"
          />
        </p>
      </fieldset>
    </form>
  </body>
</html>
